name: Promote waitlisted bookings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm eligible waitlist bookings
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$PORTAL_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${PORTAL_URL%/}/api/waitlist-promote"
